# ============================================================================
# Outbox Relay Worker Deployment (Single replica for strict ordered streaming)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agri-worker-outbox-relay
  namespace: agri-platform
  labels:
    app.kubernetes.io/name: agri-worker-outbox-relay
    app.kubernetes.io/part-of: farmer-marketplace
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agri-worker-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agri-worker-outbox-relay
        app.kubernetes.io/part-of: farmer-marketplace
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: agri-platform-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: outbox-relay
          image: agri-platform-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.outbox_relay"]
          envFrom:
            - configMapRef:
                name: agri-platform-config
            - secretRef:
                name: agri-platform-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
# ============================================================================
# Kafka Consumer Worker Deployment (Horizontally scalable consumer group)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agri-worker-kafka-consumer
  namespace: agri-platform
  labels:
    app.kubernetes.io/name: agri-worker-kafka-consumer
    app.kubernetes.io/part-of: farmer-marketplace
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agri-worker-kafka-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agri-worker-kafka-consumer
        app.kubernetes.io/part-of: farmer-marketplace
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: agri-platform-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: kafka-consumer
          image: agri-platform-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.kafka_consumer"]
          envFrom:
            - configMapRef:
                name: agri-platform-config
            - secretRef:
                name: agri-platform-secrets
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
