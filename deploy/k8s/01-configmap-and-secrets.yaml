apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-platform-config
  namespace: agri-platform
data:
  APP_ENVIRONMENT: "production"
  APP_LOG_LEVEL: "INFO"
  APP_CHECK_ALEMBIC_HEAD: "true"
  APP_CORS_ORIGINS: "https://agrimarket.local,https://app.agrimarket.local"
  APP_KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"
  APP_NATS_URL: "nats://nats.nats.svc.cluster.local:4222"
  APP_REDIS_URL: "redis://redis.redis.svc.cluster.local:6379/0"
  APP_INFERENCE_CONCURRENCY: "4"
  APP_INFERENCE_TIMEOUT_MS: "5000"
  OTEL_SERVICE_NAME: "agri-platform-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: agri-platform-secrets
  namespace: agri-platform
type: Opaque
stringData:
  APP_DATABASE_URL: "postgresql+asyncpg://postgres:change-in-production-password@postgres.postgres.svc.cluster.local:5432/agrimarket"
  APP_JWT_SECRET_KEY: "change-this-jwt-production-secret-key-at-least-32-chars-long"
  APP_ASSAY_HMAC_SECRET: "change-this-assay-hmac-secret-key-at-least-32-chars-long"
  APP_CONSENT_SIGNING_SECRET: "change-this-consent-signing-secret-key-32-chars-minimum"
  APP_METRICS_TOKEN: "internal-prometheus-cluster-scraper-secret-bearer-token"
