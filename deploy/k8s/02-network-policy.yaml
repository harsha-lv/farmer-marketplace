apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agri-platform-network-policy
  namespace: agri-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: farmer-marketplace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow traffic to API pods from Ingress controller and Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
    # 2. Allow inter-pod communication within the namespace
    - from:
        - podSelector: {}
  egress:
    # 1. DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Database (PostgreSQL / TimescaleDB)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # 3. Redis Cache
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis
      ports:
        - protocol: TCP
          port: 6379
    # 4. Apache Kafka / Redpanda
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
    # 5. NATS JetStream
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nats
      ports:
        - protocol: TCP
          port: 4222
    # 6. OpenTelemetry Collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
    # 7. Outbound HTTPS (ONDC Network Registry, BAP/BPP endpoints, AgriStack APIs)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
