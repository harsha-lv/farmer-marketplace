services:
  postgres:
    image: docker.io/timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
      POSTGRES_DB: agri
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agri"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      AGRI_ENVIRONMENT: local
      AGRI_LOG_LEVEL: INFO
      AGRI_DATABASE_URL: postgresql+asyncpg://agri:agri@postgres:5432/agri
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000"]
