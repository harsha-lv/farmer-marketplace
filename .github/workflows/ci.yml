name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Lint, Type Check, and Python Compilation
  # ============================================================================
  lint-and-validate:
    name: Code Quality & Bytecode Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade Pip and Install Quality Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff Linter Check
        run: |
          ruff check .

      - name: Mypy Type Analysis (Warn-Only Mode Initially)
        continue-on-error: true
        run: |
          mypy app/ --ignore-missing-imports

      - name: Python Bytecode Syntax Compilation
        run: |
          python -m compileall app/ alembic/

  # ============================================================================
  # Job 2: Multi-Stage Docker Container Build Validation
  # ============================================================================
  docker-build:
    name: Container Build Dry-Run
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agri-platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
