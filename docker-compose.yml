services:
  # ============================================================================
  # FastAPI Application Server
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agrimarket
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - APP_NATS_URL=nats://nats:4222
      - APP_ENVIRONMENT=production
      - APP_LOG_LEVEL=INFO
      - APP_CHECK_ALEMBIC_HEAD=false
      - OTEL_SERVICE_NAME=agri-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # Background Workers
  # ============================================================================
  outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_outbox_relay
    command: ["python", "-m", "app.workers.outbox_relay"]
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agrimarket
      - APP_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - APP_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_kafka_consumer
    command: ["python", "-m", "app.workers.kafka_consumer"]
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agrimarket
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - APP_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  beckn-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_beckn_rpc
    command: ["python", "-m", "app.workers.beckn_rpc"]
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agrimarket
      - APP_NATS_URL=nats://nats:4222
      - APP_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: agri_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agrimarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrimarket"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: agri_nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: agri_kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agri_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: agri_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data:
  redpanda_data:
  redis_data:
